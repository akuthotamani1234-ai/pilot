[pytest]
# Plain `pytest` runs only the tester's own tests (not backend/agents/test_design.py, which is an agent, not a test)
testpaths = tests
pythonpath = .
# (some tests run generated test code here, which uses the generated tests' own marker)
markers =
    slow: a test file that runs the whole tester (main.py) or a real test run - leave out with -m "not slow"
    guest: runs as a visitor who is NOT logged in (login / register pages)
