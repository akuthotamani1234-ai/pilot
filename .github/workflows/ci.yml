# Checks the tester's own code on every push and Pull Request: the code checker (ruff) and the quick tests.
# The quick tests need no internet, AI or test account (tests/conftest.py switches the AI off; the websites they test
# are practice websites started on the runner). The slow tests (whole main.py runs, 1-2 h) run only when you start
# this workflow by hand with "full" ticked (Actions -> CI -> Run workflow).
name: CI

on:
  push:
    # `final` is the blueprint integration branch; direct merges there need
    # the same regression gate as changes merged into `main`.
    branches: [main, final]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the slow tests (whole runs of the tester: 1-2 hours)"
        type: boolean
        default: false

permissions:
  contents: read

# a newer push to the same branch cancels the check that is still running
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swarm-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium for the browser acceptance test
        run: python -m playwright install --with-deps chromium
      - name: Run SQLite and filesystem checks
        run: >-
          python -m pytest -q --junitxml=swarm-local.xml
          tests/test_swarm.py tests/test_swarm_protocol.py tests/test_swarm_queue.py
          tests/test_swarm_supervisor.py tests/test_swarm_worker_verdict.py tests/test_swarm_evidence.py
          tests/test_apply_run.py tests/test_concurrent_contract.py tests/test_redis_queue_link.py
      - name: Run Redis checks
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-tools
          redis-cli ping
          python -m pytest -q --junitxml=swarm-redis.xml tests/test_swarm_redis_default.py tests/test_redis_queue.py
      - name: Require executed results in both suites
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          for path in ("swarm-local.xml", "swarm-redis.xml"):
              cases = ET.parse(path).findall(".//testcase")
              if not cases or any(case.find("skipped") is not None for case in cases):
                  raise SystemExit(f"Missing or skipped acceptance checks in {path}")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swarm-acceptance
          path: swarm-*.xml

  check:
    # Windows: the sandbox (Job Object) and the account store (DPAPI) are Windows-only
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install chromium

      - name: Check the code (ruff)
        run: python -m ruff check . --output-format github

      - name: Test the tester
        env:
          FULL: ${{ inputs.full }}
          PYTHONUTF8: "1"
        run: |
          if ($env:FULL -eq "true") {
            python -m pytest -q -n 3 --dist loadfile
          } else {
            python -m pytest -q -n 3 --dist loadfile -m "not slow"
          }
