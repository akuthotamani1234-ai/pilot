name: Android Emulator E2E

on:
  pull_request:
    paths:
      - ".github/workflows/android-emulator-ci.yml"
      - "backend/**"
      - "tests/test_android_device.py"
      - "tests/android_demo/**"
      - "requirements*.txt"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Android emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            set -euxo pipefail
            cd tests/android_demo
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.qpilot.demo || true
            adb shell am start -n com.qpilot.demo/.MainActivity --es blowai_bugs none
            adb shell pm path com.qpilot.demo
            cd ../..
            mkdir -p "$RUNNER_TEMP/android-artifacts"
            BLOWAI_ANDROID_E2E=1 BLOWAI_ANDROID_DEVICE=emulator-5554 BLOWAI_ANDROID_ARTIFACTS="$RUNNER_TEMP/android-artifacts" PYTHONUTF8=1 python -m pytest -q -s tests/test_android_device.py

      - name: Upload Android run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-evidence
          path: ${{ runner.temp }}/android-artifacts
          if-no-files-found: warn
          retention-days: 14
