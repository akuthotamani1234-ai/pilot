[pytest]
# Generated tests (copied next to them). steps_*.py hold the steps of the large test cases: they are read like test
# files so their checks are counted. A test that passes without one check is reported as INCONCLUSIVE.
python_files = test_*.py steps_*.py
enable_assertion_pass_hook = true
markers =
    guest: runs as a visitor who is NOT logged in (login / register pages)
